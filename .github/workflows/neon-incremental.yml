name: Neon 증분 수집 검증

on:
  schedule:
    # 매일 한국시간 오전 9시 (UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "실행 작업"
        required: true
        type: choice
        options:
          - export
          - crawl
          - crawl-and-export
        default: export
      request_payload_json:
        description: "선택: 기본 Form Data를 덮어쓸 JSON"
        required: false
        default: ""
      start_page:
        description: "재개 시작 페이지"
        required: false
        default: "1"

permissions:
  actions: write
  contents: write

concurrency:
  group: neon-jobkorea-incremental
  cancel-in-progress: false

jobs:
  incremental:
    name: Neon 연결 및 증분 수집
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: Neon 증분 파이프라인 실행
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOBKOREA_REQUEST_PAYLOAD_JSON: ${{ inputs.request_payload_json }}
          JOBKOREA_START_PAGE: ${{ inputs.start_page || '1' }}
        run: python scripts/neon_incremental_crawl.py "${{ inputs.command || 'crawl' }}"

      - name: 정적 JSON 저장소 반영
        if: success() && github.event_name != 'schedule' && inputs.command != 'crawl'
        run: |
          if [ -z "$(git status --porcelain -- frontend/public/static_jobs.json)" ]; then
            echo "정적 공고 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/static_jobs.json
          git commit -m "chore: refresh Neon JobKorea snapshot"
          git push

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-incremental-${{ github.run_number }}
          path: |
            frontend/public/static_jobs.json
            data/quarantine/
          if-no-files-found: warn
          retention-days: 14

      - name: GitHub Pages 갱신 요청
        if: success() && github.event_name != 'schedule' && inputs.command != 'crawl'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
