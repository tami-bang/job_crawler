name: Neon 증분 수집 검증

on:
  workflow_dispatch:
    inputs:
      command:
        description: "실행 작업"
        required: true
        type: choice
        options:
          - export
          - crawl
          - crawl-and-export
        default: export
      request_payload_json:
        description: "선택: 기본 Form Data를 덮어쓸 JSON"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: neon-jobkorea-incremental
  cancel-in-progress: false

jobs:
  incremental:
    name: Neon 연결 및 증분 수집
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: Neon 증분 파이프라인 실행
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JOBKOREA_REQUEST_PAYLOAD_JSON: ${{ inputs.request_payload_json }}
        run: python scripts/neon_incremental_crawl.py "${{ inputs.command }}"

      - name: 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-incremental-${{ github.run_number }}
          path: |
            frontend/public/static_jobs.json
            data/quarantine/
          if-no-files-found: warn
          retention-days: 14
