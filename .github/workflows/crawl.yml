name: 잡코리아 채용공고 수집

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/crawl.yml"
  schedule:
    # GitHub Actions cron은 UTC 기준입니다. 매일 한국시간 오전 9시에 실행합니다.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      keyword_batch_size:
        description: "이번 실행에서 처리할 검색 키워드 수"
        required: true
        default: "20"
      pages:
        description: "키워드별 수집 페이지 수"
        required: true
        default: "5"
      detail_limit:
        description: "상세 내용을 수집할 최대 공고 수"
        required: true
        default: "25"
      report_top_n:
        description: "리포트에 포함할 최대 공고 수"
        required: true
        default: "200"

permissions:
  contents: write

concurrency:
  group: jobkorea-crawler
  cancel-in-progress: false

jobs:
  crawl:
    name: 수집·분석·리포트 생성
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: 이전 수집 DB 복원
        uses: actions/cache/restore@v4
        with:
          path: data/job_radar.db
          key: jobkorea-db-${{ github.run_id }}
          restore-keys: |
            jobkorea-db-

      - name: Chrome 확인
        run: google-chrome --version

      - name: 채용공고 수집 및 분석
        env:
          KEYWORD_BATCH_SIZE: ${{ inputs.keyword_batch_size || '5' }}
          PAGES: ${{ inputs.pages || '1' }}
          DETAIL_LIMIT: ${{ inputs.detail_limit || '25' }}
          REPORT_TOP_N: ${{ inputs.report_top_n || '50' }}
        run: |
          KEYWORD_COUNT=$(python -c "import json; print(len(json.load(open('config/user_preferences.json'))['search_keywords']))")
          DAY_NUMBER=$(( $(date -u +%s) / 86400 ))
          KEYWORD_OFFSET=$(( (DAY_NUMBER * KEYWORD_BATCH_SIZE) % KEYWORD_COUNT ))
          python main.py jobkorea-multi-pipeline \
            --keyword-batch-size "$KEYWORD_BATCH_SIZE" \
            --keyword-offset "$KEYWORD_OFFSET" \
            --pages "$PAGES" \
            --detail-limit "$DETAIL_LIMIT" \
            --report-top-n "$REPORT_TOP_N" \
            --keyword-delay 2

      - name: 공개 데모 데이터 스냅샷 생성
        run: python scripts/export_demo_data_from_db.py --limit 500 --merge-existing

      - name: 실제 수집 결과 검증
        run: |
          JOB_COUNT=$(python -c "import sqlite3; conn = sqlite3.connect('data/job_radar.db'); print(conn.execute('SELECT COUNT(*) FROM job_postings').fetchone()[0])")
          echo "수집된 채용공고: $JOB_COUNT건"
          if [ "$JOB_COUNT" -eq 0 ]; then
            echo "::error::실제 수집된 채용공고가 없습니다. 대상 사이트 연결 상태를 확인하세요."
            exit 1
          fi

      - name: 최신 수집 DB 저장
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/job_radar.db
          key: jobkorea-db-${{ github.run_id }}

      - name: 공개 데모 자동 반영
        if: success()
        run: |
          if git diff --quiet -- frontend/services/demo-data.ts; then
            echo "공개 데이터 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/services/demo-data.ts
          git commit -m "chore: refresh daily JobKorea data"
          git push

      - name: 실행 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobkorea-result-${{ github.run_number }}
          path: |
            data/
            frontend/services/demo-data.ts
            crawler.log
          if-no-files-found: warn
          retention-days: 14
