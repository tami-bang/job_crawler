name: Neon 상세 수집 및 점수 계산

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "이번 실행 최대 처리 건수 (0은 큐 전체)"
        required: true
        default: "500"
      workers:
        description: "병렬 상세 요청 수"
        required: true
        default: "2"
      batch_size:
        description: "한 번에 임대할 큐 크기"
        required: true
        default: "20"

permissions:
  actions: write
  contents: write

concurrency:
  group: neon-jobkorea-pipeline
  cancel-in-progress: false

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 상세 수집 및 점수 계산
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python scripts/neon_detail_worker.py
          --max-jobs "${{ inputs.max_jobs || '0' }}"
          --workers "${{ inputs.workers || '2' }}"
          --batch-size "${{ inputs.batch_size || '20' }}"

      - name: 점수순 대시보드 스냅샷 생성
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/neon_incremental_crawl.py export

      - name: 정적 JSON 저장소 반영
        run: |
          if [ -z "$(git status --porcelain -- frontend/public/static_jobs.json)" ]; then
            echo "정적 공고 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/static_jobs.json
          git commit -m "chore: refresh scored JobKorea snapshot"
          git pull --rebase --autostash origin main
          git push

      - name: GitHub Pages 갱신 요청
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
