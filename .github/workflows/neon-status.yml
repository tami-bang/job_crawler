name: Neon 큐 상태 조회

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: 큐 상태 JSON 출력
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/neon_queue_stats.py
